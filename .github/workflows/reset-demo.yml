name: Reset demo data

# デモ（https://demo.facette.saedgewell.com）は誰でも管理者として操作できるため、毎日デモデータを入れ直す。
# デモデータの日付は投入した日を基準に作られる（締切前のアンケートなど）ので、入れ直すと内容も新しいまま保てる。
# 本番の D1 には触れない（CLOUDFLARE_ENV=demo で wrangler.jsonc の env.demo を使う）
on:
  schedule:
    # 毎日 4:17（日本時間）ごろ。GitHub が混んでいると遅れることがある
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-demo:
    name: Reset demo data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: demo
      url: https://demo.facette.saedgewell.com
    # CI のデモのデプロイ（deploy-demo）と同じデータベースに書き込むため、同時には動かさない
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: demo
    steps:
      - uses: actions/checkout@v7
        with:
          # 後続の pnpm install などから GitHub のトークンを読めないようにする（git の操作はしない）
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定です"
            exit 1
          fi
      - name: Check deploy config
        # デモ用の設定（D1: facette-demo、本番とは別のデータベース）であることを確かめてから書き込む
        run: |
          pnpm build
          node scripts/check-deploy-config.ts demo
      - name: Apply D1 migrations (demo)
        # デモデータは main のスキーマに合わせて作るため、未適用のマイグレーションがあれば先に適用する（通常は何もしない）
        run: pnpm wrangler d1 migrations apply DB --remote
      - name: Reset demo data
        run: |
          node scripts/generate-seed.ts
          pnpm wrangler d1 execute DB --remote --file=seed/seed.sql --yes
