name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint / Typecheck / Unit test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Biome)
        run: pnpm biome ci .
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit / API tests (Vitest + Workers runtime)
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Prepare local secrets (.dev.vars)
        run: |
          printf 'BETTER_AUTH_SECRET=%s\nGOOGLE_CLIENT_ID=e2e-client-id\nGOOGLE_CLIENT_SECRET=e2e-client-secret\n' \
            "$(openssl rand -base64 32)" > .dev.vars
      - name: Run E2E
        run: pnpm e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # デモ（https://demo.facette.saedgewell.com）。本番の前にデプロイし、マイグレーションを先に確かめる
  deploy-demo:
    name: Deploy demo
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: demo
      url: https://demo.facette.saedgewell.com
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # wrangler.jsonc の env.demo（Worker: facette-demo、D1: facette-demo）を使う
      CLOUDFLARE_ENV: demo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定です"
            exit 1
          fi
      - name: Build
        run: pnpm build
      - name: Check deploy config
        run: node scripts/check-deploy-config.ts demo
      - name: Check auth secret
        env:
          DEMO_BETTER_AUTH_SECRET: ${{ secrets.DEMO_BETTER_AUTH_SECRET }}
        run: |
          # 本番とは別の秘密鍵を使う。なければマイグレーションの前に止める
          if [ -z "$DEMO_BETTER_AUTH_SECRET" ] && ! pnpm -s wrangler secret list --format json 2>/dev/null | grep -q '"BETTER_AUTH_SECRET"'; then
            echo "::error::DEMO_BETTER_AUTH_SECRET が GitHub の Secrets にも、デモ用 Worker のシークレットにも設定されていません"
            exit 1
          fi
      - name: Apply D1 migrations (demo)
        run: pnpm wrangler d1 migrations apply DB --remote
      - name: Reset demo data
        # デモは誰でも管理者として操作できるため、デプロイのたびにデモデータを入れ直す
        run: |
          node scripts/generate-seed.ts
          pnpm wrangler d1 execute DB --remote --file=seed/seed.sql --yes
      - name: Deploy Worker (facette-demo)
        env:
          DEMO_BETTER_AUTH_SECRET: ${{ secrets.DEMO_BETTER_AUTH_SECRET }}
        run: |
          # Google ログインは使わないため、Google のシークレットは送らない
          secrets="$RUNNER_TEMP/worker-secrets.json"
          node -e '
            const v = process.env.DEMO_BETTER_AUTH_SECRET;
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify(v ? { BETTER_AUTH_SECRET: v } : {}));
          ' "$secrets"
          pnpm wrangler deploy --secrets-file "$secrets"
          rm -f "$secrets"

  # 本番（https://facette.saedgewell.com）。Google ログインのみで、データベースにデモデータは入れない
  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: deploy-demo
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
      url: https://facette.saedgewell.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # wrangler.jsonc の env.production（Worker: facette、D1: facette-production、DEMO_MODE=false）を使う
      CLOUDFLARE_ENV: production
      PRODUCTION_URL: https://facette.saedgewell.com
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定です"
            exit 1
          fi
      - name: Build
        run: pnpm build
      - name: Check deploy config
        # デモモードやデモ用のデータベースのまま本番に出さない
        run: node scripts/check-deploy-config.ts production
      - name: Check auth secret
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          # 秘密鍵がないと新しい Worker の API がすべて失敗するため、マイグレーションの前に止める
          if [ -z "$BETTER_AUTH_SECRET" ] && ! pnpm -s wrangler secret list --format json 2>/dev/null | grep -q '"BETTER_AUTH_SECRET"'; then
            echo "::error::BETTER_AUTH_SECRET が GitHub の Secrets にも Worker のシークレットにも設定されていません"
            exit 1
          fi
      - name: Apply D1 migrations (production)
        run: pnpm wrangler d1 migrations apply DB --remote
      - name: Deploy Worker (facette)
        env:
          # 登録されているものだけを Worker のシークレットとして送る（未登録なら Worker に設定済みの値をそのまま使う）
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          secrets="$RUNNER_TEMP/worker-secrets.json"
          node -e '
            const keys = ["BETTER_AUTH_SECRET", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET"];
            const out = Object.fromEntries(keys.filter((k) => process.env[k]).map((k) => [k, process.env[k]]));
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify(out));
          ' "$secrets"
          pnpm wrangler deploy --secrets-file "$secrets"
          rm -f "$secrets"
      - name: Check that demo login is rejected
        # カスタムドメインの証明書の発行を待つことがあるため、数分は繰り返す
        run: |
          for i in $(seq 1 20); do
            body=$(curl -sS -X POST "$PRODUCTION_URL/api/auth/demo-login" \
              -H 'content-type: application/json' -d '{"userId":1}' -w '\n%{http_code}' || true)
            status=$(printf '%s' "$body" | tail -n1)
            if [ "$status" = "403" ] && printf '%s' "$body" | grep -q 'demo_disabled'; then
              echo "OK: 本番のデモログインは拒否されています"
              exit 0
            fi
            echo "attempt $i: HTTP $status"
            sleep 15
          done
          echo "::error::$PRODUCTION_URL のデモログインが拒否されていることを確認できませんでした"
          exit 1

  # PR のプレビューはデモ用の Worker に出す（データベースもデモ用。本番のデータには触れない）
  preview:
    name: Preview deploy (PR)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: demo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Upload preview version (facette-demo)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          pnpm build
          node scripts/check-deploy-config.ts demo
          # デモ用の Worker は main へのマージ後に初めて作られるため、それまではプレビューを省略する。
          # それ以外の失敗はジョブを失敗させる（パイプで終了コードを隠さない）
          if ! pnpm wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" > upload.log 2>&1; then
            cat upload.log
            if grep -q "Worker that does not yet exist" upload.log; then
              echo "::warning::デモ用の Worker（facette-demo）がまだないため、プレビューを省略しました。main へのマージ後のデプロイで作られます"
              exit 0
            fi
            exit 1
          fi
          cat upload.log
