name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: "デプロイ後に本番D1へデモデータを投入する（既存データは削除されます）"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint / Typecheck / Unit test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Biome)
        run: pnpm biome ci .
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit / API tests (Vitest + Workers runtime)
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E
        run: pnpm e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定です"
            exit 1
          fi
      - name: Build
        run: pnpm build
      - name: Apply D1 migrations
        run: pnpm wrangler d1 migrations apply DB --remote
      - name: Seed demo data (first deploy, or when requested)
        env:
          FORCE_SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.seed }}
        run: |
          users=$(pnpm -s wrangler d1 execute DB --remote --json --command "SELECT count(*) AS n FROM users" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].results[0].n))')
          echo "users in production D1: $users"
          if [ "$users" = "0" ] || [ "$FORCE_SEED" = "true" ]; then
            node scripts/generate-seed.ts
            pnpm wrangler d1 execute DB --remote --file=seed/seed.sql --yes
          fi
      - name: Deploy Worker
        run: pnpm wrangler deploy --var "DEMO_MODE:${{ vars.DEMO_MODE || 'true' }}"

  preview:
    name: Preview deploy (PR)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Upload preview version
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          pnpm build
          pnpm wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" | tee upload.log
